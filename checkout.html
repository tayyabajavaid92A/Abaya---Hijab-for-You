<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Nura</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head><body><header class="checkout-header"><a class="logo" href="index.html">nura<span>.</span></a><span>Secure checkout · <a href="cart.html">Return to cart</a></span></header><main class="checkout-layout"><form class="checkout-form" id="checkoutForm"><p class="eyebrow">ALMOST YOURS</p><h1>Complete your <em>order.</em></h1><label>Email address<input type="email" required placeholder="you@example.com"></label><label>Full name<input required></label><label>Address<input required></label><div class="form-row"><label>City<input required></label><label>Province / State<input required></label></div><div class="form-row"><label>Postal code<input required></label><label>Country<input required value="Pakistan"></label></div><h2>Delivery method</h2><label class="choice"><input type="radio" name="delivery" checked> Standard shipping · Rate confirmed at launch</label><h2>Payment</h2><p class="muted">Payment provider placeholder. Never collect raw card details in this static frontend.</p><button class="button button-dark" type="submit">Place order <span>↗</span></button><p id="orderMessage" aria-live="polite"></p></form><aside class="order-panel"><p class="eyebrow">ORDER SUMMARY</p><h2>The Nura Abaya</h2><p>Quantity 1 · PKR 12,500</p><hr><strong>Total · PKR 12,500</strong></aside></main><script>document.querySelector('#checkoutForm').onsubmit=e=>{e.preventDefault();document.querySelector('#orderMessage').textContent='Thank you. Your order request has been received for confirmation.';e.target.reset()}</script></body></html>
