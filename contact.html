<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Nura</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head><body><header class="site-header"><a class="logo" href="index.html">nura<span>.</span></a><nav class="desktop-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About</a></nav></header><main class="page-shell"><section class="page-intro"><p class="eyebrow">WE'RE HERE TO HELP</p><h1>We'd love to <em>hear from you.</em></h1><p>Questions about a product, order or fit? Send us a message and our team will respond through the connected support service.</p></section><form class="contact-form" id="contactForm"><label>Name<input required name="name"></label><label>Email<input required type="email" name="email"></label><label>Subject<input name="subject"></label><label>Message<textarea required name="message" rows="6"></textarea></label><button class="button button-dark" type="submit">Send message <span>↗</span></button><p id="contactMessage" aria-live="polite"></p></form></main><script>document.querySelector('#contactForm').onsubmit=e=>{e.preventDefault();document.querySelector('#contactMessage').textContent='Thank you — your message has been received.';e.target.reset()}</script></body></html>
