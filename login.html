<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Nura</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head><body><header class="site-header"><a class="logo" href="index.html">nura<span>.</span></a><nav class="desktop-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="contact.html">Contact</a></nav></header><main class="auth-shell"><section class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Sign in to <em>Nura.</em></h1><form id="loginForm"><label>Email<input type="email" required placeholder="you@example.com"></label><label>Password<input type="password" required minlength="8" placeholder="Your password"></label><label class="check"><input type="checkbox"> Remember me</label><button class="button button-dark" type="submit">Sign in <span>↗</span></button><p id="loginMessage" aria-live="polite"></p></form><p class="muted">New here? <button class="text-link" id="registerToggle">Create an account</button></p></section></main><script>document.querySelector('#loginForm').onsubmit=e=>{e.preventDefault();document.querySelector('#loginMessage').textContent='Demo only: connect this form to a secure authentication provider.'};document.querySelector('#registerToggle').onclick=()=>document.querySelector('h1').innerHTML='Create your <em>account.</em>'</script></body></html>
